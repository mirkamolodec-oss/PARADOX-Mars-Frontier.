<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PARADOX: Mars Frontier</title>
<style>
:root{--bg:#0b0a10;--pn:rgba(16,12,18,.88);--pn2:#1d1720;--ln:#3b2c33;--tx:#f3ebe6;--mu:#a8979c;--ac:#ff7a3d;--cy:#7fd8ff;--ok:#62e08e;--wa:#ffc94a;--bad:#ff6363}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:"Space Grotesk","Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);user-select:none}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;flex:none;overflow:hidden;background:var(--bg)}
#cv{position:absolute;left:0;top:0;width:1280px;height:720px;display:block}
.hud{position:absolute;background:var(--pn);border:1px solid var(--ln);border-radius:2px}
.lbl{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu)}
.hidden{display:none!important}
button{font:inherit;font-size:12px;color:inherit;background:var(--pn2);border:1px solid var(--ln);border-radius:2px;cursor:pointer;padding:5px 10px;transition:background .12s,border-color .12s}
button:hover:not(:disabled){border-color:var(--ac);background:#2b1e22}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cy);outline-offset:1px}
button:disabled{opacity:.38;cursor:default}
button.pri{background:var(--ac);border-color:var(--ac);color:#1c0b03;font-weight:700}
button.pri:hover:not(:disabled){background:#ff935f}
.ok{color:var(--ok)}.wa{color:var(--wa)}.bad{color:var(--bad)}.mu{color:var(--mu)}.cy{color:var(--cy)}
.num{font-variant-numeric:tabular-nums}
#hudL{left:12px;top:12px;width:250px;padding:8px 10px}
.bar{display:grid;grid-template-columns:92px 1fr 34px;align-items:center;gap:6px;height:17px}
.bar i{display:block;height:6px;background:#2a2026;position:relative}
.bar i b{position:absolute;left:0;top:0;bottom:0;background:var(--ok);width:50%;transition:width .15s}
.bar em{font-style:normal;font-size:11px;text-align:right}
#env{font-size:11px;color:var(--mu);margin-top:6px;line-height:1.5}
#env b{color:var(--tx);font-weight:600}
#hudTop{left:274px;top:12px;width:760px;padding:6px 10px;display:flex;gap:12px;align-items:center}
#cr{font-size:20px;font-weight:700;color:var(--wa);min-width:118px}
#cr small{display:block;font-size:10px;letter-spacing:.14em;color:var(--mu);font-weight:400}
#res{display:grid;grid-template-columns:repeat(7,1fr);gap:2px 8px;flex:1}
.rc{font-size:11px;display:flex;justify-content:space-between;border-bottom:1px solid #2a2026;padding:1px 0}
.rc span{color:var(--mu)}
#miniBox{left:1046px;top:12px;width:222px;padding:6px}
#mini{display:block;width:208px;height:208px;background:#050306}
#miniTxt{font-size:11px;color:var(--mu);margin-top:4px;line-height:1.4}
#mis{left:12px;top:150px;width:250px;padding:8px 10px;font-size:12px;line-height:1.45}
#mis b{display:block;font-size:13px;margin:2px 0}
#veh{left:12px;bottom:12px;width:280px;padding:8px 10px;font-size:12px;line-height:1.5}
#veh{left:12px;bottom:64px;width:280px;padding:8px 10px;font-size:12px;line-height:1.5}
#hot{position:absolute;left:12px;bottom:12px;width:270px;display:flex;gap:3px}
#hot button{flex:1;height:42px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--pn);position:relative;overflow:hidden}
#hot button kbd{font-family:inherit;font-size:10px;color:var(--ac);letter-spacing:.08em}
#hot button span{font-size:11px}
#hot .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--cy);width:0}
#quickbar{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;display:flex;gap:3px;padding:4px;background:rgba(12,9,12,.92);border:1px solid #75616a;z-index:4}
#quickbar button{width:44px;height:44px;padding:2px;position:relative;background:#272126;border:2px solid #68545a;display:flex;align-items:center;justify-content:center}
#quickbar button.sel{border:2px solid #ffbf58;box-shadow:0 0 0 1px #fff inset}
#quickbar img{width:30px;height:30px;image-rendering:pixelated}
#quickbar kbd{position:absolute;left:3px;top:1px;color:#ffb46f;font-size:9px}
#quickbar b{position:absolute;right:2px;bottom:0;font-size:11px;text-shadow:1px 1px 2px #000}
#log{left:928px;bottom:12px;width:340px;height:118px;padding:6px 8px;font-size:11px;line-height:1.45;overflow:hidden}
#log div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d9cdd0}
#log .t{color:var(--mu);margin-right:5px}
#log .ok{color:var(--ok)}#log .bad{color:var(--bad)}#log .wa{color:var(--wa)}#log .auto{color:var(--cy)}
#prompt{position:absolute;left:340px;width:600px;bottom:76px;text-align:center;font-size:13px;pointer-events:none}
#prompt>span{background:var(--pn);border:1px solid var(--ln);padding:5px 12px;display:inline-block}
#prompt kbd{font-family:inherit;color:var(--ac);font-weight:700}
#prog{height:3px;background:#2a2026;margin-top:4px}#prog i{display:block;height:100%;background:var(--ac)}
#banner{position:absolute;left:240px;width:800px;top:100px;text-align:center;pointer-events:none;opacity:0;transition:opacity .35s;font-size:24px;font-weight:700;letter-spacing:.12em;text-shadow:0 2px 6px #000}
#banner.show{opacity:1}#banner small{display:block;font-size:13px;letter-spacing:0;font-weight:400;color:#eadcd5}
#toast{position:absolute;left:300px;width:680px;bottom:124px;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s;font-size:13px}
#toast.show{opacity:1}#toast span{background:#2b1a14;border:1px solid var(--ac);padding:5px 12px;display:inline-block}
#tut{left:420px;top:90px;width:440px;padding:10px 12px;border-color:var(--ac)}
#tut b{display:block;font-size:15px;margin:3px 0;color:var(--ac)}#tut p{font-size:12px;color:#e2d6d1;line-height:1.45}
#tut button{margin-top:8px;font-size:11px}
#panel{position:absolute;left:150px;top:70px;width:980px;height:560px;background:rgba(14,10,14,.97);border:1px solid var(--ln);border-radius:2px;display:flex;flex-direction:column;z-index:5}
#pHead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--ln)}
#pTitle{font-size:16px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);min-width:180px}
#pTabs{display:flex;flex:1}
#pTabs button{border-radius:0;margin-left:-1px}#pTabs button.on{background:var(--tx);color:#140d10;border-color:var(--tx)}
#pBody{flex:1;overflow:auto;padding:12px 14px;font-size:12px}
table{width:100%;border-collapse:collapse}td,th{padding:5px 6px;border-bottom:1px solid #2c2228;text-align:left;vertical-align:middle}
th{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);font-weight:400}
td button{padding:3px 7px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ln);border-left:1px solid var(--ln)}
.cell{border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);padding:8px;display:flex;flex-direction:column;gap:4px;min-height:110px}
.cell b{font-size:13px}.cell p{color:var(--mu);line-height:1.35;flex:1}
.cell.done{background:#14211a}.cell.lock{opacity:.55}
.sec{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ac);margin:14px 0 6px}
.row2{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px solid #2c2228}
select,input[type=number]{font:inherit;font-size:12px;background:var(--pn2);color:var(--tx);border:1px solid var(--ln);border-radius:2px;padding:3px 4px}
input[type=number]{width:64px}
.chip{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--ln)}
.chip.t{color:var(--ok);border-color:#2d6a44}.chip.f{color:var(--mu)}.chip.x{color:var(--wa);border-color:#7a5d1c}
#buildBar{left:300px;top:90px;width:680px;padding:8px 12px;font-size:12px;text-align:center;border-color:var(--ac)}
#overlay{position:absolute;inset:0;background:rgba(6,3,6,.72);display:flex;align-items:center;justify-content:center;z-index:10}
.card{width:640px;max-height:650px;overflow:auto;background:#140e12;border:1px solid var(--ln);border-radius:2px;padding:24px 30px}
.card h1{font-size:40px;letter-spacing:.06em;line-height:1.05}.card h1 span{color:var(--ac)}
.card h2{font-size:20px;letter-spacing:.08em;text-transform:uppercase;color:var(--ac);margin-bottom:10px}
.card p,.card li{font-size:13px;line-height:1.55;color:#ddd0cb}.card ul{padding-left:18px;margin:6px 0 10px}
.menu{display:flex;flex-direction:column;gap:6px;margin:20px 0 10px;width:300px}.menu button{padding:10px;font-size:14px;text-align:left}
.srow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--ln);font-size:13px}
.srow input[type=range]{width:220px;accent-color:var(--ac)}.srow input[type=checkbox]{width:16px;height:16px;accent-color:var(--ac)}
.foot{font-size:11px!important;color:#7a6a70!important;margin-top:12px}
kbd{font-family:inherit}
/* ===== v2: инвентарь в стиле блочных песочниц ===== */
#inv{position:absolute;left:250px;top:64px;width:780px;background:#c6c6c6;border:3px solid;border-color:#fff #555 #555 #fff;outline:2px solid #000;padding:10px 12px;color:#3f3f3f;font-family:"Courier New",Consolas,monospace;font-weight:700;z-index:6}
#inv .ih{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin-bottom:8px}
#inv .ih span{display:flex;align-items:center;gap:10px;font-size:12px}
#inv button{font-family:inherit;font-weight:700;background:#7a7a7a;color:#fff;border:2px solid;border-color:#b0b0b0 #3a3a3a #3a3a3a #b0b0b0;border-radius:0;padding:4px 9px;text-shadow:1px 1px 0 #3f3f3f}
#inv button:hover:not(:disabled){background:#7f86b8;border-color:#c4c9ee #3a3a5a #3a3a5a #c4c9ee}
#inv button:disabled{opacity:.45}
#inv .itop{display:grid;grid-template-columns:150px 1fr;gap:12px;height:236px}
#inv .pv{background:#000;border:2px solid;border-color:#373737 #fff #fff #373737;display:flex;flex-direction:column;align-items:center}
#inv .pv canvas{display:block}
#inv .pst{color:#e0e0e0;font-size:11px;text-align:center;line-height:1.4;margin-top:4px}
#inv .craft{display:flex;flex-direction:column;min-height:0}
#inv .ctabs{display:flex;align-items:center;gap:0;margin-bottom:4px}
#inv .ctabs span{flex:1;font-size:13px}
#inv .ctabs button{padding:2px 10px;font-size:11px}
#inv .ctabs button.on{background:#3f3f3f;border-color:#222 #777 #777 #222}
#inv .clist{flex:1;overflow:auto;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;padding:4px}
#inv .rcp{display:grid;grid-template-columns:44px 1fr 92px;align-items:center;gap:8px;padding:3px 4px;background:#a9a9a9;margin-bottom:3px;border:1px solid #777}
#inv .rcp.no{background:#9a9a9a;color:#5a5a5a}
#inv .rn b{display:block;font-size:12px}
#inv .rn em{display:block;font-style:normal;font-size:10px;color:#2f5a2f}
#inv .ing{display:inline-flex;align-items:center;gap:2px;font-size:11px;margin-right:8px}
#inv .ing img{width:16px;height:16px;image-rendering:pixelated}
#inv .ing.lack{color:#a01010}
#inv .ibot{display:grid;grid-template-columns:auto 1fr;gap:12px;margin-top:10px}
#inv .sgrid{display:grid;grid-template-columns:repeat(9,44px);gap:2px}
#inv .hotrow{margin-top:8px}
#inv .slot{width:44px;height:44px;background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;position:relative;display:flex;align-items:center;justify-content:center}
#inv .slot[data-k],#inv .slot[data-tk]{cursor:pointer}
#inv .slot img{width:32px;height:32px;image-rendering:pixelated;pointer-events:none}
#inv .slot b{position:absolute;right:2px;bottom:0;color:#fff;font-size:13px;text-shadow:2px 2px 0 #3f3f3f;pointer-events:none}
#inv .slot:hover{background:#a8a8a8}
#inv .slot.sel{outline:2px solid #fff;outline-offset:-5px}
#inv .slot.sm{width:40px;height:40px}
#inv .det{background:#8b8b8b;border:2px solid;border-color:#373737 #fff #fff #373737;padding:8px 10px;color:#fff;font-size:12px;line-height:1.45;text-shadow:1px 1px 0 #3f3f3f}
#inv .dh{display:flex;gap:10px;align-items:center;margin-bottom:6px}
#inv .dh img{width:40px;height:40px;image-rendering:pixelated}
#inv .dh b{display:block;font-size:14px;color:#ffff8a}
#inv .det button{margin-top:8px;width:100%}
#inv .empty{color:#eee;font-size:12px;padding:6px}
#inv .xtra{font-size:11px;margin-top:4px;color:#7a1010}
#tip{position:absolute;background:#100010;border:2px solid #2b0a66;outline:1px solid #000;color:#fff;padding:5px 8px;font-size:12px;font-family:"Courier New",Consolas,monospace;pointer-events:none;z-index:9;max-width:250px;line-height:1.4}
#tip b{display:block;color:#fff}#tip span{color:#aaa}
#adv{position:absolute;right:12px;top:262px;width:256px;background:#212121;border:2px solid #555;outline:2px solid #000;display:flex;gap:10px;align-items:center;padding:8px 10px;transform:translateX(300px);transition:transform .3s ease-out;z-index:8;font-family:"Courier New",Consolas,monospace;pointer-events:none}
#adv.show{transform:none}
#adv img{width:32px;height:32px;image-rendering:pixelated}
#adv b{display:block;color:#ffff55;font-size:13px}#adv span{color:#fff;font-size:13px}

/* ===== v3 ===== */
#mis{top:196px}
.st{display:grid;grid-template-columns:22px 32px 1fr 74px;align-items:center;gap:6px;height:24px}
.st svg{width:20px;height:20px;display:block}
.st em{font-style:normal;font-size:15px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.st i{display:block;height:5px;background:#2a2026;position:relative}
.st i b{position:absolute;left:0;top:0;bottom:0;width:50%;transition:width .2s}
.st .lbl{font-size:9px}
.st.low em{color:var(--bad)}.st.low svg{animation:pulse .7s infinite alternate}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.st.low svg{animation:none}}
.chip.b{color:var(--bad);border-color:#7a2a2a}
#pBody.tight{padding:0;overflow:hidden}
.tk{display:grid;grid-template-columns:180px 1fr 310px;height:100%}
.tk .cats{border-right:1px solid var(--ln);display:flex;flex-direction:column;overflow:auto}
.tk .cats button{border:0;border-bottom:1px solid var(--ln);border-left:3px solid transparent;border-radius:0;text-align:left;padding:10px;display:flex;gap:8px;align-items:center;background:transparent}
.tk .cats button.on{background:#221a1d;border-left-color:var(--cy)}
.tk .cats img{width:20px;height:20px;image-rendering:pixelated}
.tk .cats em{margin-left:auto;font-style:normal;font-size:10px;color:var(--ok)}
.tk .bp{padding:12px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-content:start;overflow:auto}
.bpc{border:1px solid var(--ln);background:#120d10;padding:10px 4px 8px;text-align:center;cursor:pointer;position:relative;transition:border-color .12s}
.bpc:hover{border-color:var(--mu)}
.bpc img{width:48px;height:48px;image-rendering:pixelated}
.bpc span{display:block;font-size:11px;margin-top:4px;line-height:1.25}
.bpc.ok{border-color:#2d6a44}.bpc.no img{filter:grayscale(.85) brightness(.7)}.bpc.no span{color:var(--mu)}
.bpc.on{outline:2px solid var(--cy);outline-offset:-1px}
.bpc.done::after{content:"\2713";position:absolute;right:5px;top:3px;color:var(--ok);font-weight:700}
.tk .dt{border-left:1px solid var(--ln);padding:14px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.dt .big{display:flex;gap:12px;align-items:center}
.dt .big img{width:64px;height:64px;image-rendering:pixelated;background:#120d10;border:1px solid var(--ln);padding:4px}
.dt h3{font-size:16px;color:var(--cy);line-height:1.2}
.dt p{line-height:1.45}
.mat{display:grid;grid-template-columns:26px 1fr auto;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid #2c2228}
.mat img{width:24px;height:24px;image-rendering:pixelated}
.mat small{display:block;font-size:10px}
.mat b{font-variant-numeric:tabular-nums}
.dt .sum{font-size:12px;font-weight:700}
.dt .act{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.dt .act button{padding:9px;font-size:13px}
.fab{height:6px;background:#2a2026}.fab i{display:block;height:100%;background:var(--cy);width:0}
#inv .ihint{font-size:11px;color:#4a4a4a;margin-top:6px}
#drag{position:absolute;pointer-events:none;z-index:12;width:40px;height:40px}
#drag img{width:32px;height:32px;image-rendering:pixelated;position:absolute;left:4px;top:4px}
#drag b{position:absolute;right:0;bottom:-2px;color:#fff;font:700 13px "Courier New",monospace;text-shadow:2px 2px 0 #3f3f3f}
#drag span{position:absolute;left:44px;top:10px;white-space:nowrap;background:#7a1010;color:#fff;font:700 11px "Courier New",monospace;padding:2px 6px;display:none}
#drag.out span{display:block}

/* ===== Финальный экран победы (добавлен отдельно, игровая логика не меняется) ===== */
#victoryScreen{position:absolute;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity 1.1s ease,visibility 1.1s;
  overflow:hidden;text-align:center}
#victoryScreen.show{opacity:1;visibility:visible;pointer-events:auto}
#victoryScreen:before{content:"";position:absolute;inset:0;opacity:.32;
  background-image:radial-gradient(1px 1px at 12% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 78% 18%,#d9c7a2 98%,transparent),
  radial-gradient(1px 1px at 66% 77%,#fff 98%,transparent),radial-gradient(1px 1px at 24% 82%,#d9c7a2 98%,transparent),
  radial-gradient(1px 1px at 90% 58%,#fff 98%,transparent),radial-gradient(1px 1px at 43% 36%,#fff 98%,transparent);
  background-size:100% 100%}
#victoryScreen .victoryContent{position:relative;padding:30px;animation:victoryRise 1.5s ease both}
#victoryScreen h1{font-size:clamp(26px,4vw,52px);font-weight:600;letter-spacing:.12em;line-height:1.35;
  color:#f5eee5;text-shadow:0 0 24px rgba(255,190,112,.22)}
#victoryScreen h1 span{display:block;color:#ffb36c;font-size:.72em;letter-spacing:.18em;margin-top:10px}
#victoryScreen .victoryLine{width:110px;height:1px;background:linear-gradient(90deg,transparent,#d99b63,transparent);margin:30px auto 22px}
#victoryScreen .victoryCredit{font-size:13px;letter-spacing:.28em;color:#b8a9a1;text-transform:uppercase}
@keyframes victoryRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){#victoryScreen,#victoryScreen .victoryContent{transition:none;animation:none}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
<canvas id="cv" width="1280" height="720"></canvas>
<div id="hudL" class="hud">

function drawHero(c,x,y,p,face,frame,moving,t){
 const s=moving?[0,1,0,-1][frame]:0,b=moving&&frame%2?-1:0,SU='#efe9e2',SH='#bdb2a8',OR='#ff7a3d',P=[];
 const R=(gx,gy,w,h,col)=>P.push([gx,gy,w,h,col]);
 R(-2-s,-5,2,4,SH);R(-2-s,-1,3,1,'#3d302b');               // задняя нога
 R(-1+s,-10+b,2,4,SH);R(-1+s,-6+b,2,1,'#c85a28');          // задняя рука
 R(-4,-11+b,2,6,'#7d8590');R(-4,-12+b,1,1,'#5b626b');       // ранец
 R(-2,-11+b,5,6,SU);R(-2,-8+b,5,1,OR);R(-2,-6+b,5,1,'#8a7f78');R(1,-10+b,1,1,'#62e08e'); // торс
 R(s,-5,2,4,SU);R(s,-1,3,1,'#4a3a35');                       // передняя нога
 R(-2,-16+b,6,5,SU);R(-1,-17+b,4,1,SU);R(1,-15+b,3,3,'#3fb6e8');R(2,-15+b,1,1,'#c9f3ff'); // шлем
 R(-2,-19+b,1,2,'#8a7f78');R(-2,-20+b,1,1,Math.floor(t*2)%2?OR:'#7a3a1d');               // антенна
 R(-s,-10+b,2,4,SU);R(-s,-6+b,2,1,OR);                       // передняя рука
 c.save();c.translate(Math.round(x),Math.round(y));c.scale(face,1);
 c.fillStyle='#24140f';for(const q of P)c.fillRect(q[0]*p-1,q[1]*p-1,q[2]*p+2,q[3]*p+2);

 c.restore();}

const JUNK=[['scrap',30],['cable',18],['plastic',18],['ebits',12],['oldbat',8],['shard',10],['crate',6]];
function pickJunk(){let r=Math.random()*102;for(const [k,w] of JUNK){if((r-=w)<0)return k;}return 'scrap';}
function spawnJunk(n,cx,cy,r,minR){for(let i=0;i<n;i++){let x,y;if(cx===undefined){x=rand(TS,MAP*TS-TS);y=rand(TS,MAP*TS-TS);}else{const a=rand(0,Math.PI*2),d=rand(minR||0,r);x=clamp(cx+Math.cos(a)*d,TS,MAP*TS-TS);y=clamp(cy+Math.sin(a)*d,TS,MAP*TS-TS);}const k=pickJunk();items.push({x,y,k,n:k==='scrap'?randInt(1,3):1,id:Math.random()*100});}}
function initWorld(){terrainCache.clear();world=[];nodes=[];buildings=[];items=[];const kinds=['iron','copper','ice','silicon'];const ore=()=>Math.random()<.1?'titanium':kinds[Math.floor(Math.random()*kinds.length)];
 for(let y=0;y<MAP;y++){let row=[];for(let x=0;x<MAP;x++){let n=Math.random();row.push(n<.08?2:n<.25?1:0);if(Math.random()<.018){nodes.push({x:x*TS+TS/2,y:y*TS+TS/2,k:ore(),amount:Math.floor(rand(5,18)),seen:false});}}world.push(row);}
 for(let i=0;i<8;i++){let a=rand(0,MAP*TS),b=rand(0,MAP*TS);nodes.push({x:a,y:b,k:kinds[i%4],amount:25,seen:true});}for(let i=0;i<18;i++)nodes.push({x:rand(TS,MAP*TS-TS),y:rand(TS,MAP*TS-TS),k:'oil',amount:randInt(45,90),seen:false});
 const c=MAP*TS/2;[['iron',-150,-90],['ice',170,80],['copper',-70,180]].forEach(([k,ox,oy])=>nodes.push({x:c+ox,y:c+oy,k,amount:20,seen:true}));
 spawnJunk(30,c,c,480,80);spawnJunk(135);}
function ensureTitanium(){if(!nodes.some(n=>n.k==='titanium')){for(let i=0;i<14;i++)nodes.push({x:rand(TS,MAP*TS-TS),y:rand(TS,MAP*TS-TS),k:'titanium',amount:randInt(6,14),seen:false});}}

function normB(b){b.k=b.k||KIND_BY_NAME[b.type]||'shuttle';if(b.k==='shuttle')b.type='Шаттл';if(b.k==='hab'){b.type='Жилой купол';if(!Array.isArray(b.mods)||b.mods.length!==6)b.mods=[null,null,null,null,null,null];}else if(BUILD_DEFS[b.k])b.type=BUILD_DEFS[b.k].n;if(b.on===undefined)b.on=true;b.t=b.t||0;b.st=b.st||'';if(b.ni===undefined)b.ni=-1;return b;}
function saveGame(){try{localStorage.setItem(SAVE_KEY,JSON.stringify({ver:4,player,res,credits,day,time,nodes,buildings,logs,items,discovered:[...discovered],upgrades,slots,grid:{e:grid.e},seed,autoMined,wires,tutorialStage,rocketLaunched,rocketRepaired}));}catch(e){}}
function loadGame(){try{let d=JSON.parse(localStorage.getItem(SAVE_KEY)||'null');if(!d)return false;if(d.player&&d.res&&Array.isArray(d.nodes)&&Array.isArray(d.buildings)){player=Object.assign({x:MAP*TS/2,y:MAP*TS/2,hp:100,o2:100,en:100,st:100,fd:100},d.player);res=d.res;credits=d.credits||0;day=d.day||1;time=d.time||8;nodes=d.nodes;buildings=d.buildings.map(normB);logs=Array.isArray(d.logs)?d.logs:[];
 if(Array.isArray(d.items))items=d.items;
 discovered=new Set(Array.isArray(d.discovered)?d.discovered:Object.keys(res).filter(k=>res[k]>0));
 upgrades=Object.assign({drill:0,scan:0},d.upgrades||{});
 slots=Array.isArray(d.slots)&&d.slots.length===36?d.slots.map(s=>s&&ITEMS[s.k]&&!ITEMS[s.k].ground&&s.n>0?{k:s.k,n:Math.floor(s.n)}:null):new Array(36).fill(null);
 grid.e=d.grid&&isFinite(d.grid.e)?+d.grid.e:10;if(d.seed)seed=d.seed;autoMined=d.autoMined||0;wires=Array.isArray(d.wires)?d.wires.filter(w=>Array.isArray(w)&&w.length===2&&buildings[w[0]]&&buildings[w[1]]):[];tutorialStage=Number.isInteger(d.tutorialStage)?d.tutorialStage:2;rocketLaunched=!!d.rocketLaunched;rocketRepaired=!!d.rocketRepaired;
 if(!buildings.some(b=>b.k==='shuttle'))buildings.push(normB({x:MAP*TS/2+55,y:MAP*TS/2+20,type:'Шаттл',k:'shuttle',hp:100}));
 ensureTitanium();syncSlots();return true;}}catch(e){}return false;}

/* ---------- ЭНЕРГОСЕТЬ И АВТОМАТИКА ---------- */
function nodeFor(b){let n=nodes[b.ni];if(n&&n.amount>0&&dist(n.x,n.y,b.x,b.y)<=260)return n;b.ni=-1;let best=261;for(let i=0;i<nodes.length;i++){const m=nodes[i];if(m.amount<=0)continue;const d=dist(m.x,m.y,b.x,b.y);if(d<best){best=d;b.ni=i;}}return b.ni>=0?nodes[b.ni]:null;}
function produce(o,k){if(k==='drill'){playSfx('mining');const n=nodeFor(o);if(!n)return;const got=Math.min(n.k==='oil'?5:3,n.amount);n.amount-=got;n.seen=true;if(n.k==='oil'){if(connectedToShuttle(o)){addItem('fuel',got*2,o.x,o.y);log(`Бур подал ${got*2} ед. топлива в ракетный контур.`,'ok');}else{addItem('oil',got,o.x,o.y);log('Добыта нефть. Соедините бур с ракетой медным проводом для перекачки топлива.','wa');}}else addItem(n.k,got,o.x,o.y);autoMined+=got;if(n.amount<=0)log(`Буровая: пласт исчерпан (${n.k==='oil'?'нефть':nm(n.k)})`,'wa');}
 else if(k==='farm'){res.water-=1;addItem('food',2,o.x,o.y);}
 else if(k==='tree'){res.water-=1;addItem('apple',3);}
 else if(k==='o2gen'){res.ice-=1;addItem('o2tank',1);}}
function connected(a,b){if(a===b)return true;const seen=new Set([a]),q=[a];while(q.length){const n=q.shift();for(const w of wires){const z=w[0]===n?w[1]:w[1]===n?w[0]:-1;if(z<0||seen.has(z))continue;if(z===b)return true;seen.add(z);q.push(z);}}return false;}

function automation(dt){const sun=sunF();let prod=0,solars=0;
 for(const b of buildings){if(b.k==='solar'){solars++;const p=b.on?2*sun:0;prod+=p;b.pow=p>0;b.st=!b.on?'выключено':p>0?`выработка +${p.toFixed(1)} эн./с`:'ночь — нет выработки';}else if(b.k==='shuttle'){b.st='ожидает подключения солнечной сети';}else if(b.k==='hab'){b.st=`модулей: ${b.mods.filter(Boolean).length}/6`;}}
 grid.cap=20+solars*40;grid.prod=prod;grid.e=Math.min(grid.cap,grid.e+prod*dt);
 const cons=[];for(const b of buildings)if(b.k==='hab'&&hasSolarPower(b))b.mods.forEach(m=>{if(m)cons.push([m,MODS[m.k].pw,m.k,b]);});
 for(const b of buildings)if(b.k==='farm'&&hasSolarPower(b))cons.push([b,PWR.farm,'farm',b]);
 for(const b of buildings)if(b.k==='drill'&&hasSolarPower(b))cons.push([b,PWR.drill,'drill',b]);
 let used=0;
 for(const [o,pw,k,source] of cons){o.pow=false;if(!o.on){o.st='выключено';continue;}
  let why='';if(!hasSolarPower(source))why='нет кабеля к солнечной сети';else if(k==='drill'&&!nodeFor(o))why='нет подземного пласта в радиусе 260';else if((k==='farm'||k==='tree')&&have('water')<1)why='нет воды';else if(k==='o2gen'&&have('ice')<1)why='нет льда';
  if(why){o.st=why;continue;}
  const need=pw*dt;if(grid.e<need){o.st='нет энергии';continue;}
  grid.e-=need;used+=pw;o.pow=true;o.t=(o.t||0)+dt;o.st=`работает · ${Math.max(0,Math.ceil(PERIOD[k]-o.t))} с до цикла`;
  if(o.t>=PERIOD[k]){o.t-=PERIOD[k];produce(o,k);}}
 const shuttle=buildings.find(b=>b.k==='shuttle');if(shuttle&&hasSolarPower(shuttle)&&grid.e>0&&rocketRepaired){const charge=Math.min(grid.e,dt*.35);grid.e-=charge;shuttle.charge=Math.min(100,(shuttle.charge||0)+charge);used+=charge/Math.max(dt,.001);shuttle.st=`заряд ${Math.floor(shuttle.charge||0)}%`;}
 grid.use=used;}

const TERRAIN_CHUNK_TILES=8, TERRAIN_CHUNK_PX=TERRAIN_CHUNK_TILES*TS;

function terrainChunk(cx,cy){
 const key=cx+','+cy;
 let c=terrainCache.get(key);
 if(c){terrainCache.delete(key);terrainCache.set(key,c);return c;}
 const pad=48, size=TERRAIN_CHUNK_PX+pad*2;

 const g=c.getContext('2d');
 g.fillStyle='#a45a3e';g.fillRect(0,0,size,size);
 const wx0=cx*TERRAIN_CHUNK_PX-pad, wy0=cy*TERRAIN_CHUNK_PX-pad;
 const tx0=Math.floor(wx0/TS), tx1=Math.ceil((wx0+size)/TS);
 const ty0=Math.floor(wy0/TS), ty1=Math.ceil((wy0+size)/TS);
 const fills=['rgba(52,25,19,.30)','rgba(228,143,99,.24)','rgba(72,36,27,.20)','rgba(194,105,70,.25)'];
 g.lineWidth=1;
 for(let ty=ty0;ty<ty1;ty++)for(let tx=tx0;tx<tx1;tx++){
  if(tx<0||ty<0||tx>=MAP||ty>=MAP)continue;
  const seed0=(tx*73856093^ty*19349663)>>>0;
  for(let r=0;r<5;r++){
   const q=(seed0+r*83492791)>>>0;
   const x=tx*TS-wx0+((q>>>2)%48)-4, y=ty*TS-wy0+((q>>>8)%48)-4;
   const rad=4+((q>>>14)%9), stretch=.55+((q>>>20)%70)/100, rot=((q>>>5)%100)/100;
   g.beginPath();
   for(let j=0;j<8;j++){
    const a=rot+j*Math.PI/4,rr=rad*(.72+(((q>>>(j%5))&7)/20));
    const px=x+Math.cos(a)*rr,py=y+Math.sin(a)*rr*stretch;
    if(j===0)g.moveTo(px,py);else g.lineTo(px,py);
   }
   g.closePath();g.fillStyle=fills[r%4];g.fill();
   g.strokeStyle='rgba(48,22,17,.18)';g.stroke();
  }
 }
 terrainCache.set(key,c);
 if(terrainCache.size>TERRAIN_CACHE_LIMIT)terrainCache.delete(terrainCache.keys().next().value);

}

window.addEventListener('keyup',e=>keys.delete(e.code));
window.addEventListener('blur',()=>keys.clear());
$('quickbar').addEventListener('click',e=>{const b=e.target.closest('[data-q]');if(b)selectQuick(+b.dataset.q);});$('quickbar').addEventListener('contextmenu',e=>{e.preventDefault();useQuick();});$('pClose').onclick=closePanel;$('tutSkip').onclick=()=>finishTutorial();
document.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{let h=b.dataset.h;b.blur();if(h==='scan'){if(!paused)scan();}else if(h==='menu')menu();else toggleWin(h);});
$('inv').addEventListener('click',e=>{const t=e.target.closest('[data-craft],[data-use],[data-filter],#invClose');if(!t)return;if(t.id==='invClose'){closeInv();return;}if(t.dataset.craft)craft(t.dataset.craft);else if(t.dataset.use)useItem(t.dataset.use);else if(t.dataset.filter){invFilter=t.dataset.filter;renderInv();}});
$('inv').addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('mousedown',e=>{mouseX=e.clientX;mouseY=e.clientY;if(!invOpen)return;const i=slotAt(e.clientX,e.clientY);dragMoved=false;
 if(i>=0){e.preventDefault();slotClick(i,e.button,e.shiftKey);return;}
 if(held&&!inInv(e.clientX,e.clientY)){e.preventDefault();dropHeld();}});
window.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY;if(held&&invOpen){if(e.buttons)dragMoved=true;posDrag();}});
window.addEventListener('mouseup',e=>{mouseX=e.clientX;mouseY=e.clientY;if(!invOpen||dragFrom<0){dragFrom=-1;return;}const from=dragFrom;dragFrom=-1;if(!held||!dragMoved)return;const i=slotAt(e.clientX,e.clientY);if(i>=0&&i!==from){placeHeld(i);renderInv();updDrag();}else if(i<0&&!inInv(e.clientX,e.clientY))dropHeld();});
window.addEventListener('contextmenu',e=>{if(invOpen)e.preventDefault();});
$('inv').addEventListener('mousemove',e=>{const t=e.target.closest('[data-k],[data-tk]'),tip=$('tip');if(!t||held){tip.classList.add('hidden');return;}const k=t.dataset.k||t.dataset.tk,r=$('stage').getBoundingClientRect(),s=r.width/W;tip.innerHTML=`<b>${nm(k)}</b><span>${ITEMS[k].d}</span>`;tip.style.left=Math.min(W-260,(e.clientX-r.left)/s+14)+'px';tip.style.top=((e.clientY-r.top)/s+12)+'px';tip.classList.remove('hidden');});
$('inv').addEventListener('mouseleave',()=>$('tip').classList.add('hidden'));
cv.addEventListener('contextmenu',e=>{e.preventDefault();if(buildMode)cancelBuild();});
cv.addEventListener('click',e=>{if(!buildMode||paused||inside)return;let r=cv.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width+camera.x,y=(e.clientY-r.top)*H/r.height+camera.y;if(buildMode==='wire'){let bi=-1,bd=75;buildings.forEach((b,i)=>{const d=dist(x,y,b.x,b.y);if(d<bd){bd=d;bi=i;}});if(bi<0){toast('Щёлкните по ракете, куполу, панели или буру');return;}if(wireStart===null){wireStart=bi;toast('Теперь выберите второй объект');return;}if(wireStart===bi){toast('Выберите другой объект');return;}if(wires.some(w=>(w[0]===wireStart&&w[1]===bi)||(w[1]===wireStart&&w[0]===bi))){toast('Эти объекты уже соединены');wireStart=null;return;}if(have('cwire')<1){toast('Закончилась медная проволока');cancelBuild();return;}res.cwire--;playSfx('construction');wires.push([wireStart,bi]);log(`Проведён кабель: ${buildings[wireStart].type} ↔ ${buildings[bi].type}`,'ok');wireStart=null;buildMode=null;$('buildBar').classList.add('hidden');updateHud();return;}if(Math.hypot(x-player.x,y-player.y)>450){toast('Слишком далеко от исследователя');return;}if(buildings.some(b=>Math.hypot(b.x-x,b.y-y)<55)){toast('Место занято');return;}const def=BUILD_DEFS[buildMode];if(!affordable(def.cost)){toast('Недостаточно ресурсов');cancelBuild();return;}pay(def.cost);playSfx('construction');const nb=normB({x,y,type:def.n,k:buildMode,hp:100});buildings.push(nb);if(nb.k==='hab'&&tutorialStage===1)finishTutorial();if(nb.k==='drill'&&!nodeFor(nb))toast('Внимание: рядом нет месторождения — бур будет простаивать');log(`Построено: ${def.n}`,'ok');buildMode=null;$('buildBar').classList.add('hidden');updateHud();});

initWorld();if(loadGame()){log('Сохранённая экспедиция загружена.','ok');}else{newGame();}function fitStage(){let st=$('stage'),scale=Math.min(innerWidth/W,innerHeight/H);st.style.transform=`scale(${scale})`;st.style.transformOrigin='center center';}window.addEventListener('resize',fitStage);fitStage();window.addEventListener('beforeunload',saveGame);updateHud();drawMini();menu();requestAnimationFrame(loop);
window.__PX={get s(){return {player,res,slots,held,buildings,items,grid,inside,room,openWin,invOpen,paused,running,nodes}},step,automation,syncSlots,slotClick,dropHeld,enterHab,exitHab,toggleWin,interact,normB,saveGame,loadGame,setTime:t=>{time=t;}};
})();
</script>
</body>
